server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:${sky.redis.password:}}
    database: ${REDIS_DATABASE:0}
    connect-timeout: 3s
    timeout: 3s
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  shop:
    # 实际门店完整地址，例如：北京市海淀区上地十街10号
    address: ${SHOP_ADDRESS:}
    # 百度地图服务端应用 AK，需开通地理编码与骑行路线规划权限
    baidu-ak: ${BAIDU_MAP_AK:}
  alioss:
    endpoint: ${ALI_OSS_ENDPOINT:}
    region: ${ALI_OSS_REGION:}
    access-key-id: ${ALI_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALI_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALI_OSS_BUCKET_NAME:}
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${JWT_ADMIN_SECRET}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: ${JWT_USER_SECRET}
    # 设置jwt过期时间
    user-ttl: 7200000
    # 设置前端传递过来的令牌名称
    user-token-name: authentication
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
    mchid: ${WECHAT_MCHID:}
    mch-serial-no: ${WECHAT_MCH_SERIAL_NO:}
    private-key-file-path: ${WECHAT_PRIVATE_KEY_FILE_PATH:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    we-chat-pay-cert-file-path: ${WECHAT_PAY_CERT_FILE_PATH:}
    notify-url: ${WECHAT_NOTIFY_URL:}
    refund-notify-url: ${WECHAT_REFUND_NOTIFY_URL:}
